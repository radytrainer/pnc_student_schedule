<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Calendar </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
        }
        .calendar-container {
            height: calc(100vh - 180px);
            min-height: 550px;
        }
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        /* Style for optgroup labels */
        optgroup {
            font-weight: bold;
            font-style: normal;
            color: #1e293b;
            background: #f1f5f9;
        }
        option {
            background: white;
            padding: 8px;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Student's Calendar</h1>
                <p class="text-slate-500">Access your academic and group schedules</p>
            </div>

            <!-- Selector -->
            <div class="relative inline-block w-full md:w-96 text-left">
                <label for="calendarSelect" class="block text-sm font-semibold text-slate-700 mb-1 ml-1">Select Schedule</label>
                <select id="calendarSelect" onchange="updateCalendar()" class="block w-full px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer text-slate-700">
                    <optgroup label="Year 2">
                        <option value="c_4641706806a2bc464ecfce3054fce93b2ebd72161c407d074ba961f730e4d793@group.calendar.google.com">Y2-A</option>
                        <option value="c_60f24913a85bf20e950e70146ff604d69d14749a316da204fa485e7d6731a12b@group.calendar.google.com">Y2-B</option>
                        <option value="c_2da1c687af3c99d3ecaf14bbc5d82b9cc9b0fc75dcca546fd690ea5070091940@group.calendar.google.com">Y2-C</option>
                    </optgroup>
                    <optgroup label="Year 1">
                        <option value="c_dab09f6598d565f82430eaa5c51ab4b01045bb20a340a7273f4a67a911c6f61c@group.calendar.google.com">Y1-A</option>
                        <option value="c_2e32feb66be240456f961cc2f43c0bbef9c5ff6cbb68abdea333adf1739f9833@group.calendar.google.com">Y1-B</option>
                        <option value="c_4f19b4ea9a24523bb7910e4d19bb0f426abdfc3e2b67850a4d5770e4755674db@group.calendar.google.com">Y1-C</option>
                        <option value="c_60360764ac056113deb843d3bc1a8dd6e66a0bbddcf4dbd1ff4ea3453417dc3e@group.calendar.google.com">Y1-D</option>
                    </optgroup>
                </select>
            </div>
        </header>

        <!-- Calendar Display -->
        <main class="calendar-container relative bg-white rounded-xl overflow-hidden border border-slate-200">
            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-white z-10 transition-opacity duration-300">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-slate-400 text-sm">Loading schedule...</p>
                </div>
            </div>
            <iframe id="calendarFrame" src="" style="border-width:0" frameborder="0" scrolling="no"></iframe>
        </main>

        <!-- Footer Info -->
        <footer class="mt-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-400">
            <p>External view generated via Google Calendar Embed API.</p>
            <p class="italic text-center md:text-right">Make sure calendar IDs are set to "Public" in Google Calendar settings.</p>
        </footer>
    </div>

    <script>
        function updateCalendar() {
            const selector = document.getElementById('calendarSelect');
            const iframe = document.getElementById('calendarFrame');
            const loading = document.getElementById('loading');
            const calendarId = encodeURIComponent(selector.value);
            
            // Show loading state
            loading.style.opacity = '1';
            loading.classList.remove('hidden');
            
            // Construct the Google Calendar Embed URL
            // added &mode=WEEK to ensure the weekly view is default
            const baseUrl = "https://calendar.google.com/calendar/embed";
            const params = `?src=${calendarId}&mode=WEEK&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=1`;
            
            iframe.src = baseUrl + params;

            // Hide loading when iframe loads
            iframe.onload = () => {
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 300);
            };
        }

        // Initialize on page load
        window.onload = updateCalendar;
    </script>
</body>
</html>
