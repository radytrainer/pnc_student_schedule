<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Calendar Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scroll, let iframe handle it */
            background-color: #f8fafc;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        .calendar-container {
            flex-grow: 1; /* Occupy remaining vertical space */
            width: 100%;
            position: relative;
        }
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
        }
        /* Custom scrollbar for the selector dropdown */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
        optgroup {
            font-weight: bold;
            color: #1e293b;
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Compact Header -->
        <header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight hidden xs:block">Calendar Hub</h1>
            </div>

            <!-- Selector -->
            <div class="w-full sm:w-auto flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider hidden md:block">Schedule:</span>
                <select id="calendarSelect" onchange="updateCalendar()" class="w-full sm:w-64 pl-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium text-slate-700 transition-all cursor-pointer">
                    <optgroup label="Year 2">
                        <option value="c_4641706806a2bc464ecfce3054fce93b2ebd72161c407d074ba961f730e4d793@group.calendar.google.com">Y2-A</option>
                        <option value="c_60f24913a85bf20e950e70146ff604d69d14749a316da204fa485e7d6731a12b@group.calendar.google.com">Y2-B</option>
                        <option value="c_2da1c687af3c99d3ecaf14bbc5d82b9cc9b0fc75dcca546fd690ea5070091940@group.calendar.google.com">Y2-C</option>
                    </optgroup>
                    <optgroup label="Year 1">
                        <option value="c_dab09f6598d565f82430eaa5c51ab4b01045bb20a340a7273f4a67a911c6f61c@group.calendar.google.com">Y1-A</option>
                        <option value="c_2e32feb66be240456f961cc2f43c0bbef9c5ff6cbb68abdea333adf1739f9833@group.calendar.google.com">Y1-B</option>
                        <option value="c_4f19b4ea9a24523bb7910e4d19bb0f426abdfc3e2b67850a4d5770e4755674db@group.calendar.google.com">Y1-C</option>
                        <option value="c_60360764ac056113deb843d3bc1a8dd6e66a0bbddcf4dbd1ff4ea3453417dc3e@group.calendar.google.com">Y1-D</option>
                    </optgroup>
                </select>
            </div>
        </header>

        <!-- Full Screen Calendar Area -->
        <main class="calendar-container">
            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-white z-10 transition-opacity duration-300">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-3"></div>
                    <p class="text-slate-400 text-xs font-medium">Syncing events...</p>
                </div>
            </div>
            <iframe id="calendarFrame" src="" frameborder="0" scrolling="no"></iframe>
        </main>
    </div>

    <script>
        function updateCalendar() {
            const selector = document.getElementById('calendarSelect');
            const iframe = document.getElementById('calendarFrame');
            const loading = document.getElementById('loading');
            const calendarId = encodeURIComponent(selector.value);
            
            // Initial loading state
            loading.style.opacity = '1';
            loading.classList.remove('hidden');
            
            // Build URL with full responsiveness parameters
            // wkst=1 sets week start to Sunday (standard)
            const baseUrl = "https://calendar.google.com/calendar/embed";
            const params = `?src=${calendarId}&mode=WEEK&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=1&wkst=1&bgcolor=%23ffffff`;
            
            iframe.src = baseUrl + params;

            // Simple load listener
            iframe.onload = () => {
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 300);
            };
        }

        // Initialize immediately
        updateCalendar();
        
        // Handle window resizing (mobile orientation changes)
        window.addEventListener('resize', () => {
            // Keep the iframe sizing correct
            const wrapper = document.querySelector('.main-wrapper');
            wrapper.style.height = window.innerHeight + 'px';
        });
    </script>
</body>
</html>
