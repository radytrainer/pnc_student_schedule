<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Scheduler | PNC Calendar</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase & Chart.js for Dashboard -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pn-logo.png" type="image/x-icon">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="pn-logo.png">

    <!-- Apply saved theme / sidebar state before first paint (prevents flash) -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
</head>

<body>
    <div class="app-container">
        <!-- Top navigation bar -->
        <header class="topbar">
            <div class="topbar-left">
                <a class="brand" href="./" aria-label="PNC Schedule home">
                    <img src="pn-logo.png" alt="" class="brand-mark">
                    <span class="brand-text">
                        <span class="brand-name">PNC Schedule</span>
                        <span class="brand-sub">Passerelles Numériques</span>
                    </span>
                </a>

                <span class="topbar-divider" aria-hidden="true"></span>

                <!-- Calendar picker (trainers + classes) -->
                <div class="picker" id="picker">
                    <button id="picker-btn" class="picker-btn" type="button" aria-haspopup="true"
                        aria-expanded="false" aria-controls="picker-menu">
                        <span class="color-dot" id="picker-dot"></span>
                        <span class="picker-text">
                            <span class="picker-kind" id="picker-kind">Calendar</span>
                            <span class="picker-name" id="picker-name">Select…</span>
                        </span>
                        <i class="fas fa-chevron-down picker-caret"></i>
                    </button>

                    <div class="picker-menu" id="picker-menu" hidden>
                        <div class="picker-search">
                            <i class="fas fa-magnifying-glass"></i>
                            <input type="search" id="picker-search" placeholder="Search trainers or classes"
                                autocomplete="off" aria-label="Search trainers or classes">
                        </div>
                        <div class="picker-scroll">
                            <div class="picker-section">
                                <div class="picker-heading">Trainers</div>
                                <div class="checkbox-list" id="teacher-filters"><!-- Populated by JS --></div>
                            </div>
                            <div class="picker-section">
                                <div class="picker-heading">Classes</div>
                                <div class="checkbox-list" id="class-filters"><!-- Populated by JS --></div>
                            </div>
                            <div class="picker-empty" id="picker-empty" hidden>No matches</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="topbar-center">
                <button id="today-btn" class="nav-btn today-btn" type="button" title="Go to today">Today</button>
                <div class="stepper">
                    <button id="prev-week-btn" class="nav-btn icon-only" type="button" title="Previous week"
                        aria-label="Previous week"><i class="fas fa-chevron-left"></i></button>
                    <button id="next-week-btn" class="nav-btn icon-only" type="button" title="Next week"
                        aria-label="Next week"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="week-label">
                    <span class="week-pill">W<span id="current-week-num"></span></span>
                    <span id="current-month-year" class="week-range"></span>
                </div>

                <!-- Week / Day toggle (mobile) -->
                <div class="mobile-view-toggle" role="tablist">
                    <button class="toggle-btn active" data-view="week" type="button">
                        <i class="fas fa-calendar-week"></i><span>Week</span>
                    </button>
                    <button class="toggle-btn" data-view="day" type="button">
                        <i class="fas fa-calendar-day"></i><span>Day</span>
                    </button>
                </div>
            </div>

            <div class="topbar-right">
                <div class="topbar-stats">
                    <div id="session-count-badge" class="session-badge" style="display: none;">
                        <span class="badge-count">0</span>
                        <span class="badge-label">Sessions</span>
                    </div>
                    <div id="hour-count-badge" class="session-badge" style="display: none;">
                        <span class="badge-count">0</span>
                        <span class="badge-label">Hours</span>
                    </div>
                </div>

                <button id="theme-toggle-btn" class="nav-btn icon-only" type="button"
                    title="Switch to dark mode" aria-label="Switch to dark mode">
                    <i class="fas fa-moon"></i>
                </button>

                <button id="open-dashboard-btn" class="btn btn-primary dashboard-open-btn" type="button">
                    <i class="fas fa-chart-bar"></i><span>Dashboard</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="content-body" style="padding: 0; height: 100%; overflow: hidden;">
                <div class="calendar-container" style="height: 100%; width: 100%; overflow: hidden; position: relative;">
                    <div id="weekly-view" style="height: 100%; width: 100%;">
                        <iframe id="google-calendar-iframe" style="border: 0; width: 100%; height: calc(100% + 50px);"
                            frameborder="0"></iframe>
                    </div>
                    
                    <div id="daily-view" class="daily-view-container" style="display: none;">
                        <div class="daily-navigation">
                            <button id="prev-day-btn" class="icon-btn"><i class="fas fa-chevron-left"></i></button>
                            <div id="current-day-display" class="current-day-text">Today</div>
                            <button id="next-day-btn" class="icon-btn"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        
                        <div class="sessions-container" id="daily-sessions">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Dashboard Overlay (Desktop Only) -->
    <div id="dashboard-overlay" class="dashboard-overlay" style="display:none">
        <div class="dashboard-panel">

            <div class="dashboard-header">
                <div class="dashboard-title">
                    <i class="fas fa-chart-bar"></i>
                    <h2>Trainer Workload Dashboard</h2>
                </div>
                <div class="dashboard-header-actions">
                    <button id="print-report-btn" class="btn btn-secondary">
                        <i class="fas fa-print"></i> Print Report
                    </button>
                    <button id="close-dashboard-btn" class="dashboard-close-btn" title="Close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="dashboard-filters">
                <div class="filter-field">
                    <label>From Month</label>
                    <input type="month" id="dash-from-month">
                </div>
                <div class="filter-field">
                    <label>To Month</label>
                    <input type="month" id="dash-to-month">
                </div>
                <div class="filter-field">
                    <label>Group / Filter by Role</label>
                    <select id="dash-role-filter">
                        <option value="all">All Roles</option>
                        <option value="IT Trainer">IT Trainer</option>
                        <option value="IT Coor">IT Coordinator</option>
                        <option value="ENG/PL Trainer">ENG/PL Trainer</option>
                        <option value="ENG/PL Coor">ENG/PL Coordinator</option>
                        <option value="English Trainer">English Trainer</option>
                        <option value="PL Trainer">PL Trainer</option>
                    </select>
                </div>
                <div class="dash-filter-actions">
                    <button id="load-dashboard-btn" class="btn btn-primary">
                        <i class="fas fa-sync-alt"></i> Load Data
                    </button>
                    <button id="force-refresh-btn" class="btn btn-secondary" title="Bypass cache and re-fetch from Google Calendar" style="display:none">
                        <i class="fas fa-redo"></i> Force Refresh
                    </button>
                </div>
                <div class="fb-status-badge" id="fb-status-badge">
                    <span class="fb-dot" id="fb-dot"></span>
                    <span id="fb-status-text">Firebase</span>
                </div>
            </div>

            <div class="dashboard-body" id="dashboard-body">
                <div class="dashboard-placeholder">
                    <i class="fas fa-chart-bar"></i>
                    <p>Select a date range and click <strong>Load Data</strong> to view trainer workload.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>

</html>
