<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Scheduler | PNC Calendar</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pn-logo.png" type="image/x-icon">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="pn-logo.png">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="header-top-row">
                    <div class="logo-container" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <div class="logo-text">
                            <img src="logo.png" alt="Logo" style="max-height: 40px; display: block;">
                        </div>
                        <div class="badges-wrapper" style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <div id="session-count-badge" class="session-badge" style="display: none;">
                                <span class="badge-count">0</span>
                                <span class="badge-label">SESSIONS</span>
                            </div>
                            <div id="hour-count-badge" class="session-badge" style="display: none;">
                                <span class="badge-count">0</span>
                                <span class="badge-label">HOURS</span>
                            </div>
                        </div>
                    </div>

                    <!-- Custom Week Navigation -->
                    <div class="week-navigation"
                        style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <button id="prev-week-btn" class="icon-btn" style="padding: 4px; color: var(--primary-color);"><i
                                class="fas fa-chevron-left"></i></button>
                        <div style="text-align: center; cursor: pointer;" id="today-btn" title="Go to Today">
                            <div style="font-weight: 700; color: var(--primary-color); font-size: 14px;">W<span
                                    id="current-week-num"></span></div>
                            <div id="current-month-year"
                                style="font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.5px;">
                            </div>
                        </div>
                        <button id="next-week-btn" class="icon-btn" style="padding: 4px; color: var(--primary-color);"><i
                                class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- Mobile View Toggle -->
                <div class="mobile-view-toggle">
                    <button class="toggle-btn active" data-view="week">
                        <i class="fas fa-calendar-week"></i> Weekly View
                    </button>
                    <button class="toggle-btn" data-view="day">
                        <i class="fas fa-calendar-day"></i> Daily View
                    </button>
                </div>
            </div>

            <div class="sidebar-filters" style="margin-top: 0; border-top: none;">
                <details class="filter-group" id="trainers-details" open>
                    <summary class="section-title">
                        Trainers
                        <i class="fas fa-chevron-down"></i>
                    </summary>
                    <div class="checkbox-list scrollable" id="teacher-filters">
                        <!-- Populated by JS -->
                    </div>
                </details>

                <details class="filter-group" id="classes-details" open>
                    <summary class="section-title">
                        Classes
                        <i class="fas fa-chevron-down"></i>
                    </summary>
                    <div class="checkbox-list scrollable" id="class-filters">
                        <!-- Populated by JS -->
                    </div>
                </details>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-body" style="padding: 0; height: 100%; overflow: hidden;">
                <div class="calendar-container" style="height: 100%; width: 100%; overflow: hidden; position: relative;">
                    <div id="weekly-view" style="height: 100%; width: 100%;">
                        <iframe id="google-calendar-iframe" style="border: 0; width: 100%; height: calc(100% + 50px);"
                            frameborder="0"></iframe>
                    </div>
                    
                    <div id="daily-view" class="daily-view-container" style="display: none;">
                        <div class="daily-navigation">
                            <button id="prev-day-btn" class="icon-btn"><i class="fas fa-chevron-left"></i></button>
                            <div id="current-day-display" class="current-day-text">Today</div>
                            <button id="next-day-btn" class="icon-btn"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        
                        <div class="sessions-container" id="daily-sessions">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
