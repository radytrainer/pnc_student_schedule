<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Scheduler | PNC Calendar</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pn-logo.png" type="image/x-icon">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-text">
                        <img src="logo.png" alt="Logo" style="max-height: 45px; display: block;">
                    </div>
                </div>

                <!-- Custom Week Navigation -->
                <div class="week-navigation"
                    style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <button id="prev-week-btn" class="icon-btn" style="padding: 4px; color: var(--primary-color);"><i
                            class="fas fa-chevron-left"></i></button>
                    <div style="text-align: center; cursor: pointer;" id="today-btn" title="Go to Today">
                        <div style="font-weight: 700; color: var(--primary-color); font-size: 14px;">Week <span
                                id="current-week-num"></span></div>
                        <div id="current-month-year"
                            style="font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px;">
                        </div>
                    </div>
                    <button id="next-week-btn" class="icon-btn" style="padding: 4px; color: var(--primary-color);"><i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="sidebar-filters" style="margin-top: 0; border-top: none;">
                <div class="filter-group">
                    <label class="section-title">Trainers</label>
                    <div class="checkbox-list scrollable" id="teacher-filters">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="filter-group">
                    <label class="section-title">Classes</label>
                    <div class="checkbox-list scrollable" id="class-filters">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-body" style="padding: 0; height: 100vh; overflow: hidden;">
                <div class="calendar-container" style="height: 100vh; width: 100%; overflow: hidden;">
                    <iframe id="google-calendar-iframe" style="border: 0; width: 100%; height: calc(100vh + 50px);"
                        frameborder="0"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
